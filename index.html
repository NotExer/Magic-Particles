<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Magic Particles — Gesture Studio</title>
    <link rel="icon" type="image/svg+xml" href="./assets/project-mark.svg">
    <style>
        :root {
            color-scheme: dark;
            --bg: #090a0f;
            --panel: rgba(22, 23, 31, 0.84);
            --panel-solid: #171820;
            --panel-soft: rgba(255,255,255,0.055);
            --line: rgba(255,255,255,0.11);
            --text: #f5f5f7;
            --muted: #9b9ca8;
            --accent: #a78bfa;
            --accent-strong: #c4b5fd;
            --success: #6ee7b7;
            --warning: #fbbf24;
            --radius-lg: 18px;
            --radius-md: 12px;
        }
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -0.01em; }
        button, a { -webkit-tap-highlight-color: transparent; }
        button:focus-visible, a:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 3px; }

        #navbar { position: fixed; top: 0; left: 0; right: 0; height: 64px; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: rgba(9,10,15,0.78); backdrop-filter: blur(22px) saturate(140%); border-bottom: 1px solid var(--line); }
        #navbar .brand {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: #fff;
            font-size: 0.98rem; font-weight: 650; letter-spacing: -0.02em;
        }
        #navbar .brand img { width: 34px; height: 34px; border-radius: 10px; box-shadow: 0 0 22px rgba(167,139,250,.24); }
        #navbar .nav-links { display: flex; align-items: center; gap: 12px; }
        #navbar .nav-links a {
            color: var(--muted); text-decoration: none; font-size: 0.83rem; font-weight: 550;
            display: flex; align-items: center; gap: 6px;
            transition: color 0.2s;
        }
        #navbar .nav-links a:hover { color: var(--text); }
        #navbar .nav-links a svg { width: 18px; height: 18px; fill: currentColor; }

        #sidebar { position: fixed; top: 64px; bottom: 0; left: 0; width: 250px; z-index: 30; padding: 28px 16px 22px; background: rgba(12,13,19,.78); border-right: 1px solid var(--line); backdrop-filter: blur(20px); }
        .eyebrow { margin: 0 10px 10px; color: #777987; text-transform: uppercase; letter-spacing: .12em; font-size: .68rem; font-weight: 700; }
        .scene-nav { display: grid; gap: 5px; }
        .scene-item { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; min-height: 48px; padding: 7px 10px; color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: var(--radius-md); text-align: left; cursor: pointer; transition: .2s ease; }
        .scene-item:hover { background: var(--panel-soft); color: var(--text); }
        .scene-item.active { color: var(--text); background: linear-gradient(100deg, rgba(167,139,250,.18), rgba(167,139,250,.04)); border-color: rgba(167,139,250,.26); }
        .scene-item .scene-icon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: rgba(255,255,255,.07); color: var(--accent-strong); }
        .scene-item svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .scene-item .scene-name { font-size: .84rem; font-weight: 600; }
        .scene-item .scene-gesture { display: grid; place-items: center; min-width: 23px; height: 23px; padding: 0 5px; border-radius: 7px; color: #bab0e8; background: rgba(167,139,250,.1); font-size: .72rem; font-weight: 700; }
        .sidebar-foot { position: absolute; right: 16px; bottom: 22px; left: 16px; padding-top: 16px; border-top: 1px solid var(--line); color: #6f707d; font-size: .72rem; line-height: 1.45; }
        .sidebar-foot b { color: var(--muted); font-weight: 600; }

        #workspace { position: fixed; inset: 64px 0 0 250px; pointer-events: none; z-index: 10; }
        #workspace-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 30px 32px; }
        #workspace-head h1 { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 1.3rem; letter-spacing: -.035em; font-weight: 650; }
        .workspace-icon { width: 28px; height: 28px; }
        #workspace-head p { margin: 7px 0 0; color: var(--muted); font-size: .83rem; }
        .live-pill { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 999px; background: rgba(18,19,27,.68); color: #bbbcc6; font-size: .72rem; font-weight: 650; }
        .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 12px var(--success); }

        #video-container {
            position: absolute;
            top: 104px; right: 32px; width: 282px; height: 212px;
            border: 1px solid rgba(255,255,255,0.16);
            z-index: 20; background: #000;
            border-radius: var(--radius-lg); overflow: hidden;
            box-shadow: 0 18px 60px rgba(0,0,0,.42); background: #111218;
        }
        #video-container::before { content: 'Cámara'; position: absolute; top: 12px; left: 13px; z-index: 2; padding: 4px 7px; border: 1px solid rgba(255,255,255,.13); border-radius: 6px; background: rgba(8,9,13,.58); color: rgba(255,255,255,.8); font-size: .68rem; font-weight: 650; }
        #video-container::after { content: ''; position: absolute; right: 13px; top: 12px; width: 18px; height: 18px; z-index: 2; background: url('./assets/window-camera.svg') center/contain no-repeat; opacity: .9; }

        video { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; transform: scaleX(-1); }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }

        #grain {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 5;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
        }

        #status { position: absolute; right: 32px; bottom: 28px; padding: 9px 14px; border-radius: 999px; background: rgba(20,21,29,.82); border: 1px solid var(--line); color: var(--warning); font-size: .76rem; font-weight: 600; z-index: 30; box-shadow: 0 10px 30px rgba(0,0,0,.24); }
        #camera-action { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 35; padding: 11px 16px; border: 1px solid rgba(196,181,253,.4); border-radius: 999px; background: rgba(49,46,129,.82); color: #fff; font: 650 .78rem ui-sans-serif, sans-serif; cursor: pointer; box-shadow: 0 8px 30px rgba(0,0,0,.3); transition: .2s ease; }
        #camera-action:hover { background: rgba(124,58,237,.9); transform: translate(-50%, -50%) scale(1.03); }
        #camera-action[hidden] { display: none; }
        #gesture-hint { position: absolute; bottom: 30px; left: 32px; color: rgba(255,255,255,.64); font-size: .76rem; pointer-events: none; }
        #gesture-hint kbd { margin: 0 3px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; color: var(--text); background: rgba(255,255,255,.06); font-size: .68rem; }

        /* ========== MOBILE RESPONSIVE ========== */
        @media (max-width: 820px) {
            #navbar {
                top: 0; bottom: auto;
                border-bottom: 1px solid var(--line);
                border-top: none;
                height: 58px; padding: 0 16px;
            }
            #navbar .brand span { display: none; }
            #navbar .brand img { width: 30px; height: 30px; }
            #navbar .nav-links a span { display: none; }
            #navbar .nav-links a svg { width: 24px; height: 24px; }

            #sidebar { top: 58px; width: 100%; height: 92px; bottom: auto; padding: 10px 12px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
            .eyebrow, .sidebar-foot { display: none; }
            .scene-nav { display: flex; min-width: max-content; gap: 6px; }
            .scene-item { grid-template-columns: 30px 1fr; min-width: 112px; min-height: 68px; padding: 7px; }
            .scene-item .scene-gesture { display: none; }
            .scene-item .scene-name { font-size: .72rem; }
            #workspace { inset: 150px 0 0; }
            #workspace-head { padding: 20px 18px; }
            #workspace-head h1 { font-size: 1.1rem; }
            #gesture-hint { left: 18px; bottom: 420px; }
            #video-container {
                position: fixed;
                bottom: 0; left: 12px; right: 12px;
                top: auto;
                width: auto; height: 360px; border-radius: var(--radius-lg);
                border: 1px solid var(--line);
                box-shadow: 0 18px 50px rgba(0,0,0,.46);
            }

            #status {
                bottom: 378px; left: 50%; right: auto; transform: translateX(-50%);
            }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
    </script>
</head>

    <aside id="sidebar" aria-label="Biblioteca de escenas">

        <div class="scene-nav">
            <button class="scene-item active" data-scene="-1"><span class="scene-icon"><svg viewBox="0 0 24 24"><path d="M5 18.5h.01M9.5 14h.01M15 8h.01M19 4.5h.01M4 20 20 4"/></svg></span><span class="scene-name">Ambiente</span><span class="scene-gesture">—</span></button>
            <button class="scene-item" data-scene="0"><span class="scene-icon"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zM9 5v14M15 5v14M5 9h14M5 15h14"/></svg></span><span class="scene-name">Jaula digital</span><span class="scene-gesture">0</span></button>
            <button class="scene-item" data-scene="1"><span class="scene-icon"><svg viewBox="0 0 24 24"><path d="m13 2-9 11h7l-1 9 9-12h-7l1-8Z"/></svg></span><span class="scene-name">Rayos</span><span class="scene-gesture">1</span></button>
            <button class="scene-item" data-scene="2"><span class="scene-icon"><svg viewBox="0 0 24 24"><path d="M7 3c10 3 10 15 0 18M17 3C7 6 7 18 17 21M7 7h10M7 12h10M7 17h10"/></svg></span><span class="scene-name">Doble hélice</span><span class="scene-gesture">2</span></button>
            <button class="scene-item" data-scene="3"><span class="scene-icon"><svg viewBox="0 0 24 24"><path d="M12 21V8M12 12 6 8M12 15l6-5M12 8l-2-4M12 8l3-4M6 8 4 5M18 10l2-3"/></svg></span><span class="scene-name">Árbol fractal</span><span class="scene-gesture">3</span></button>
            <button class="scene-item" data-scene="4"><span class="scene-icon"><svg viewBox="0 0 24 24"><path d="m5 7 5-3 4 5 5-1M5 7l2 9 7 4 5-3M10 4l-3 12M14 9l-7 7M19 8l-5 1"/></svg></span><span class="scene-name">Constelación</span><span class="scene-gesture">4</span></button>
            <button class="scene-item" data-scene="5"><span class="scene-icon"><svg viewBox="0 0 24 24"><path d="M12 2v5m0 10v5M2 12h5m10 0h5M4.9 4.9l3.5 3.5m7.2 7.2 3.5 3.5m0-14.2-3.5 3.5m-7.2 7.2-3.5 3.5"/></svg></span><span class="scene-name">Explosión</span><span class="scene-gesture">5</span></button>
        </div>
        <div class="sidebar-foot"><b>Gesture Studio</b><br>Levanta los dedos para cambiar de escena.</div>

    <section id="workspace" aria-hidden="true">
        <div id="workspace-head"><div><h1><img class="workspace-icon" src="./assets/window-scene.svg" alt="">Gesture Studio</h1><p>Un espacio vivo para explorar tus gestos.</p></div><div class="live-pill"><span class="live-dot"></span>Seguimiento activo</div></div>
        <div id="gesture-hint"><kbd>0—5</kbd> también puedes seleccionar una escena desde la biblioteca</div>

<script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { FilesetResolver, HandLandmarker } from
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/vision_bundle.mjs';

    const TIP_IDS = [4, 8, 12, 16, 20];
    const sin = Math.sin, cos = Math.cos, PI = Math.PI, rand = Math.random, sqrt = Math.sqrt;
    const sph = () => { const t=rand()*PI*2, p=Math.acos(2*rand()-1); return {st:sin(p),ct:cos(p),sa:sin(t),ca:cos(t)}; };

    // ===================== SCENE =====================
    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
    cam.position.z = 55;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, cam));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.5, 0.4, 0.85);
    composer.addPass(bloom);

    // ===================== PARTICLES (points) =====================
    const COUNT = 16000;
    const pGeo = new THREE.BufferGeometry();
    const pos = new Float32Array(COUNT*3), col = new Float32Array(COUNT*3), siz = new Float32Array(COUNT);
    const tP = new Float32Array(COUNT*3), tC = new Float32Array(COUNT*3), tS = new Float32Array(COUNT);
    pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    pGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    pGeo.setAttribute('size', new THREE.BufferAttribute(siz, 1));
    const pts = new THREE.Points(pGeo, new THREE.PointsMaterial({
        size: 0.3, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
    }));

    // ===================== LINES (segments) =====================
    const LINES = 3500;
    const V = LINES * 2;
    const lGeo = new THREE.BufferGeometry();
    const lPos = new Float32Array(V*3), lCol = new Float32Array(V*3);
    const tLP = new Float32Array(V*3), tLC = new Float32Array(V*3);
    lGeo.setAttribute('position', new THREE.BufferAttribute(lPos, 3));
    lGeo.setAttribute('color', new THREE.BufferAttribute(lCol, 3));
    const lns = new THREE.LineSegments(lGeo, new THREE.LineBasicMaterial({
        vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
    }));

    const grp = new THREE.Group();
    grp.add(pts); grp.add(lns);
    scene.add(grp);

    // ===================== HELPERS =====================
    let pi = 0, li = 0;
    function sp(i, x,y,z, r,g,b, s) {
        tP[i*3]=x; tP[i*3+1]=y; tP[i*3+2]=z;
        tC[i*3]=r; tC[i*3+1]=g; tC[i*3+2]=b; tS[i]=s;
    }
    function sl(i, x1,y1,z1, x2,y2,z2, r,g,b, r2,g2,b2) {
        const v=i*6;
        tLP[v]=x1; tLP[v+1]=y1; tLP[v+2]=z1;
        tLP[v+3]=x2; tLP[v+4]=y2; tLP[v+5]=z2;
        tLC[v]=r; tLC[v+1]=g; tLC[v+2]=b;
        tLC[v+3]=r2??r; tLC[v+4]=g2??g; tLC[v+5]=b2??b;
    }

    // ===================== EFFECTS =====================

    // -1: NO HAND → subtle ambient dust
    function fxAmbient() {
        for (let i=0; i<COUNT*0.03; i++) {
            const r=20+rand()*35; const {st,ct,sa,ca}=sph();
            sp(pi++, r*st*ca, r*st*sa, r*ct, 0.06, 0.06, 0.12, 0.25);
        }
    }

    // 0: FIST Wireframe digital cage (green matrix lines)
    function fxCage() {
        // Wireframe cube edges
        const S = 22;
        const corners = [];
        for (let x=-1;x<=1;x+=2) for (let y=-1;y<=1;y+=2) for (let z=-1;z<=1;z+=2)
            corners.push([x*S, y*S, z*S]);
        // Cube edges: connect corners that differ in exactly one coordinate
        for (let a=0; a<8; a++) for (let b=a+1; b<8; b++) {
            let diff=0;
            for (let d=0;d<3;d++) if (corners[a][d]!==corners[b][d]) diff++;
            if (diff===1 && li<LINES)
                sl(li++, ...corners[a], ...corners[b], 0, 0.9, 0.2);
        }
        // Diagonal internal lines
        for (let i=0; i<40 && li<LINES; i++) {
            const a=corners[Math.floor(rand()*8)], b=corners[Math.floor(rand()*8)];
            if (a!==b) sl(li++, ...a, ...b, 0, 0.3, 0.1);
        }
        // Random grid lines inside the cube
        for (let i=0; i<500 && li<LINES; i++) {
            const a = [(rand()-0.5)*S*2, (rand()-0.5)*S*2, (rand()-0.5)*S*2];
            const axis = Math.floor(rand()*3);
            const b=[...a]; b[axis] += (rand()>0.5?1:-1)*(3+rand()*10);
            sl(li++, a[0],a[1],a[2], b[0],b[1],b[2], 0, 0.15+rand()*0.4, 0);
        }
        // Dot particles at intersections
        for (let i=0; i<COUNT*0.08; i++) {
            sp(pi++, (rand()-0.5)*S*2, (rand()-0.5)*S*2, (rand()-0.5)*S*2,
                0, 0.3+rand()*0.7, 0, 0.4+rand()*0.6);
        }
    }

    // 1: ONE FINGER Lightning web (cyan/white branching bolts)
    function fxLightning() {
        // Core glow
        for (let i=0; i<COUNT*0.04; i++) {
            const r=rand()*5; const {st,ct,sa,ca}=sph();
            sp(pi++, r*st*ca, r*st*sa, r*ct, 0.6, 0.9, 1.0, 2.5);
        }
        // Branching bolts
        function bolt(x,y,z, dx,dy,dz, depth) {
            if (depth>5 || li>=LINES) return;
            const steps = 8+Math.floor(rand()*8);
            for (let s=0; s<steps && li<LINES; s++) {
                const len=2+rand()*3;
                const nx=x+dx*len+(rand()-0.5)*4;
                const ny=y+dy*len+(rand()-0.5)*4;
                const nz=z+dz*len+(rand()-0.5)*4;
                const bright = 0.5+rand()*0.5;
                sl(li++, x,y,z, nx,ny,nz, bright*0.5,bright*0.8,bright);
                if (pi<COUNT) sp(pi++, nx,ny,nz, 0.7,0.9,1.0, 1.2+rand());
                if (rand()<0.3) bolt(nx,ny,nz, dx+(rand()-0.5)*0.7, dy+(rand()-0.5)*0.7, dz+(rand()-0.5)*0.7, depth+1);
                x=nx; y=ny; z=nz;
            }
        }
        for (let b=0; b<12; b++) { const {st,ct,sa,ca}=sph(); bolt(0,0,0, st*ca,st*sa,ct, 0); }
        // Ambient sparks
        while (pi<COUNT*0.1) { const r=rand()*55; const {st,ct,sa,ca}=sph(); sp(pi++, r*st*ca,r*st*sa,r*ct, 0.1,0.2,0.5, 0.2); }
    }

    // 2: TWO FINGERS DNA double helix (cyan + magenta)
    function fxDNA() {
        const R=12, H=60, turns=5, strandPts=300;
        for (let s=0; s<strandPts; s++) {
            const t = s/strandPts;
            const angle = t*turns*PI*2;
            const y = -H/2 + t*H;
            // Strand 1
            const x1=R*cos(angle), z1=R*sin(angle);
            // Strand 2
            const x2=R*cos(angle+PI), z2=R*sin(angle+PI);
            // Particles on strands
            if (pi<COUNT) sp(pi++, x1,y,z1, 0.0,0.8,1.0, 1.2);
            if (pi<COUNT) sp(pi++, x2,y,z2, 1.0,0.2,0.8, 1.2);
            // Lines connecting consecutive strand points
            if (s>0) {
                const pt = (s-1)/strandPts;
                const pa = pt*turns*PI*2;
                const py = -H/2+pt*H;
                if (li<LINES) sl(li++, R*cos(pa),py,R*sin(pa), x1,y,z1, 0.0,0.6,0.8);
                if (li<LINES) sl(li++, R*cos(pa+PI),py,R*sin(pa+PI), x2,y,z2, 0.8,0.1,0.6);
            }
            // Rungs connecting the two strands every N points
            if (s%8===0 && li<LINES) {
                sl(li++, x1,y,z1, x2,y,z2, 0.3,0.3,0.5, 0.5,0.1,0.4);
                if (pi<COUNT) sp(pi++, (x1+x2)/2, y, (z1+z2)/2, 0.5,0.5,0.9, 1.8);
            }
        }
        // Background particles
        while (pi<COUNT*0.08) { const r=20+rand()*25; const {st,ct,sa,ca}=sph(); sp(pi++, r*st*ca,r*st*sa,r*ct, 0.1,0.1,0.3, 0.2); }
    }

    // 3: THREE FINGERS Fractal tree (gold/amber growing branches)
    function fxTree() {
        function branch(x,y,z, dx,dy,dz, len, depth) {
            if (depth>8 || li>=LINES*0.95) return;
            const nx=x+dx*len, ny=y+dy*len, nz=z+dz*len;
            const t = depth/8;
            sl(li++, x,y,z, nx,ny,nz, 0.4+t*0.5, 0.25+t*0.4, 0.0);
            if (pi<COUNT) sp(pi++, nx,ny,nz, 1.0, 0.6+t*0.4, 0.1, depth>5 ? 2.0+rand() : 0.6);
            // Particles along the branch for glow
            if (pi<COUNT) sp(pi++, (x+nx)/2,(y+ny)/2,(z+nz)/2, 0.6+t*0.3,0.3+t*0.3,0.0, 0.4);
            const kids = depth<3 ? 3 : 2;
            for (let c=0; c<kids; c++) {
                const spread = 0.5+depth*0.05;
                branch(nx,ny,nz,
                    dx+(rand()-0.5)*spread, Math.abs(dy)*(0.65+rand()*0.25)+0.05, dz+(rand()-0.5)*spread,
                    len*(0.6+rand()*0.15), depth+1);
            }
        }
        branch(0,-28,0, 0,1,0, 9, 0);
        branch(-18,-28,8, 0.05,1,0, 6, 1);
        branch(18,-28,-8, -0.05,1,0, 6, 1);
        // Fireflies
        while (pi<COUNT*0.08) sp(pi++, (rand()-0.5)*55,-28+rand()*56,(rand()-0.5)*35, 1.0,0.85,0.2, 0.2+rand()*0.3);
    }

    // 4: FOUR FINGERS Constellation network (purple/pink connected nodes)
    function fxConstellation() {
        const nodes = [];
        const N = 250;
        for (let i=0; i<N; i++) {
            const r=5+rand()*38; const {st,ct,sa,ca}=sph();
            const node = {x:r*st*ca, y:r*st*sa, z:r*ct};
            nodes.push(node);
            if (pi<COUNT) sp(pi++, node.x,node.y,node.z, 0.7+rand()*0.3, 0.2+rand()*0.4, 0.9, 1.5+rand()*2);
        }
        // Connect nodes within distance
        for (let i=0; i<N && li<LINES; i++) {
            for (let j=i+1; j<N && li<LINES; j++) {
                const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y, dz=nodes[i].z-nodes[j].z;
                const d=sqrt(dx*dx+dy*dy+dz*dz);
                if (d<16) {
                    const b=1-d/16;
                    sl(li++, nodes[i].x,nodes[i].y,nodes[i].z, nodes[j].x,nodes[j].y,nodes[j].z,
                        0.5*b,0.15*b,0.7*b, 0.7*b,0.3*b,0.5*b);
                }
            }
        }
        // Nebula background
        while (pi<COUNT*0.12) { const r=35+rand()*30; const {st,ct,sa,ca}=sph(); sp(pi++, r*st*ca,r*st*sa,r*ct, 0.2,0.05,0.35, 0.15); }
    }

    // 5: FIVE FINGERS → Cosmic starburst (multicolor radial explosion)
    function fxBurst() {
        // White core
        for (let i=0; i<COUNT*0.08; i++) {
            const r=rand()*6; const {st,ct,sa,ca}=sph();
            sp(pi++, r*st*ca,r*st*sa,r*ct, 1,1,1, 3.0);
        }
        // Radial line rays
        const rays = 80;
        for (let r=0; r<rays; r++) {
            const {st,ct,sa,ca}=sph();
            const hue = r/rays;
            const cr=sin(hue*PI*2)*0.5+0.5, cg=sin(hue*PI*2+2.09)*0.5+0.5, cb=sin(hue*PI*2+4.19)*0.5+0.5;
            const len = 18+rand()*28;
            let x=0,y=0,z=0;
            const segs=3+Math.floor(rand()*3);
            for (let s=0; s<segs && li<LINES; s++) {
                const t=(s+1)/segs;
                const nx=st*ca*len*t+(rand()-0.5)*2, ny=st*sa*len*t+(rand()-0.5)*2, nz=ct*len*t+(rand()-0.5)*2;
                sl(li++, x,y,z, nx,ny,nz, cr,cg,cb);
                if (pi<COUNT) sp(pi++, nx,ny,nz, cr,cg,cb, 1.5+rand());
                x=nx; y=ny; z=nz;
            }
        }
        // Expanding colored cloud
        while (pi<COUNT*0.35) {
            const r=12+rand()*35; const {st,ct,sa,ca}=sph();
            const hue=rand();
            sp(pi++, r*st*ca,r*st*sa,r*ct,
                sin(hue*PI*2)*0.5+0.5, sin(hue*PI*2+2.09)*0.5+0.5, sin(hue*PI*2+4.19)*0.5+0.5, 0.5+rand());
        }
    }

    // ===================== STATE =====================
    const statusEl = document.getElementById('status');
    const sceneButtons = [...document.querySelectorAll('.scene-item')];
    const sceneNames = ['Ambiente', 'Jaula digital', 'Rayos', 'Doble hélice', 'Árbol fractal', 'Constelación', 'Explosión'];
    let cur = -99, shakeIntensity = 0, rotSpeed = {x:0,y:0,z:0};
    let noHandFrames = 0;

    function selectSceneButton(f) {
        sceneButtons.forEach(btn => btn.classList.toggle('active', Number(btn.dataset.scene) === f));
    }
    sceneButtons.forEach(btn => btn.addEventListener('click', () => setElement(Number(btn.dataset.scene))));
    addEventListener('keydown', e => {
        if (/^[0-5]$/.test(e.key)) setElement(Number(e.key));
    });

    function setElement(f) {
        if (f === cur) return;
        cur = f;
        selectSceneButton(f);
        statusEl.textContent = f < 0 ? 'Sin mano · Ambiente' : `${sceneNames[f + 1]} · ${f} dedos`;
        statusEl.style.color = f < 0 ? 'var(--muted)' : 'var(--accent-strong)';
        pi = 0; li = 0;
        tP.fill(0); tC.fill(0); tS.fill(0);
        tLP.fill(0); tLC.fill(0);

        if      (f===-1) { fxAmbient();       shakeIntensity=0;   bloom.strength=0.8; rotSpeed={x:0,y:0.003,z:0}; }
        else if (f===0)  { fxCage();           shakeIntensity=0;   bloom.strength=1.8; rotSpeed={x:0.006,y:0.012,z:0.003}; }
        else if (f===1)  { fxLightning();      shakeIntensity=0.3; bloom.strength=3.0; rotSpeed={x:0,y:0.005,z:0}; }
        else if (f===2)  { fxDNA();            shakeIntensity=0;   bloom.strength=2.2; rotSpeed={x:0,y:0.025,z:0.005}; }
        else if (f===3)  { fxTree();           shakeIntensity=0;   bloom.strength=2.0; rotSpeed={x:0,y:0.008,z:0}; }
        else if (f===4)  { fxConstellation();  shakeIntensity=0;   bloom.strength=2.2; rotSpeed={x:0.004,y:0.012,z:0}; }
        else if (f===5)  { fxBurst();          shakeIntensity=0.5; bloom.strength=4.0; rotSpeed={x:0.012,y:0.025,z:0.006}; }
    }

    // ===================== FINGER COUNTING =====================
    function countFingers(landmarks) {
        const fingers = [];
        const thumbTip=landmarks[4], thumbMcp=landmarks[2], thumbCmc=landmarks[1], pinkyMcp=landmarks[17];
        if (thumbCmc.x>pinkyMcp.x) fingers.push(thumbTip.x>thumbMcp.x);
        else fingers.push(thumbTip.x<thumbMcp.x);
        for (let i=1;i<5;i++) fingers.push(landmarks[TIP_IDS[i]].y < landmarks[TIP_IDS[i]-2].y);
        return fingers.filter(Boolean).length;
    }

    let confirmed=0, candidate=0, candCount=0;
    function smooth(raw) {
        if (raw===candidate) candCount++; else { candidate=raw; candCount=1; }
        if (candCount>=3) confirmed=candidate;
        return confirmed;
    }

    // ===================== DRAW HAND =====================
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const cameraAction = document.getElementById('camera-action');
    const ctx = overlay.getContext('2d');
    let currentStream = null;
    let starting = false;
    function drawHand(lm) {
        const w=overlay.width, h=overlay.height;
        ctx.fillStyle='#FFD700';
        for (const id of TIP_IDS) { ctx.beginPath(); ctx.arc(lm[id].x*w, lm[id].y*h, 5, 0, PI*2); ctx.fill(); }
    }

    // ===================== ANIMATION =====================
    function animate() {
        requestAnimationFrame(animate);
        if (shakeIntensity>0) {
            renderer.domElement.style.transform=`translate(${(rand()-0.5)*shakeIntensity*30}px,${(rand()-0.5)*shakeIntensity*30}px)`;
        } else renderer.domElement.style.transform='translate(0,0)';

        const lerp=0.07;
        for (let i=0;i<COUNT*3;i++) { pos[i]+=(tP[i]-pos[i])*lerp; col[i]+=(tC[i]-col[i])*lerp; }
        for (let i=0;i<COUNT;i++) siz[i]+=(tS[i]-siz[i])*lerp;
        for (let i=0;i<V*3;i++) { lPos[i]+=(tLP[i]-lPos[i])*lerp; lCol[i]+=(tLC[i]-lCol[i])*lerp; }

        pts.geometry.attributes.position.needsUpdate = pts.geometry.attributes.color.needsUpdate = pts.geometry.attributes.size.needsUpdate = true;
        lns.geometry.attributes.position.needsUpdate = lns.geometry.attributes.color.needsUpdate = true;

        grp.rotation.x+=rotSpeed.x; grp.rotation.y+=rotSpeed.y; grp.rotation.z+=rotSpeed.z;
        composer.render();
    }
    animate();

    // ===================== MEDIAPIPE =====================
    async function main() {
        if (starting) return;
        if (location.protocol === 'file:') {
            statusEl.style.display = 'block';
            statusEl.innerHTML = 'Abre la app desde un servidor local.<br><small>Ejecuta <b>npm start</b> y entra en <b>http://localhost:3000</b>.</small>';
            cameraAction.disabled = false;
            cameraAction.textContent = 'Abrir desde localhost';
            return;
        }
        starting = true;
        cameraAction.disabled = true;
        cameraAction.textContent = currentStream ? 'Preparando detector…' : 'Solicitando permiso…';
        statusEl.style.display = 'block';
        statusEl.textContent = currentStream ? 'Preparando seguimiento…' : 'Solicitando permiso de cámara…';
        if (!currentStream) currentStream = await navigator.mediaDevices.getUserMedia({video:{width:1920,height:1080,facingMode:'user'}});
        if (!video.srcObject) video.srcObject = currentStream;
        if (video.paused) await video.play();
        overlay.width=video.videoWidth || 1280; overlay.height=video.videoHeight || 720;
        statusEl.textContent='Preparando seguimiento…';
        const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/wasm');
        statusEl.textContent='Cargando detector…';
        let hl;
        const opts = { baseOptions:{modelAssetPath:'./models/hand_landmarker.task'}, runningMode:'VIDEO', numHands:1, minHandDetectionConfidence:0.5, minHandPresenceConfidence:0.5, minTrackingConfidence:0.4 };
        try { hl = await HandLandmarker.createFromOptions(vision, {...opts, baseOptions:{...opts.baseOptions, delegate:'GPU'}}); }
        catch { hl = await HandLandmarker.createFromOptions(vision, opts); }

        statusEl.textContent='Cargando';
        statusEl.textContent='Listo';
        starting = false;
        cameraAction.hidden = true;
        setTimeout(()=>statusEl.style.display='none', 2000);
        setElement(-1);

        let lastTime=-1;
        function loop() {
            const now=performance.now();
            if (now!==lastTime) {
                lastTime=now;
                const res=hl.detectForVideo(video, now);
                ctx.clearRect(0,0,overlay.width,overlay.height);
                if (res.landmarks && res.landmarks.length>0) {
                    noHandFrames=0;
                    const lm=res.landmarks[0];
                    drawHand(lm);
                    setElement(smooth(countFingers(lm)));
                } else {
                    noHandFrames++;
                    if (noHandFrames>10) { setElement(-1); confirmed=-1; candidate=-1; candCount=0; }
                }
            }
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    }
    cameraAction.addEventListener('click', () => main().catch(handleCameraError));
    function handleCameraError(err) {
        let msg=err.message;
        if (err.name==='NotAllowedError') msg='Permiso de cámara denegado.';
        if (err.name==='NotFoundError') msg='No se encontró ninguna cámara.';
        if (err.name==='NotReadableError') msg='La cámara está siendo usada por otra aplicación.';
        if (!msg) msg='No se pudo iniciar el seguimiento.';
        starting = false;
        cameraAction.disabled = false;
        cameraAction.hidden = false;
        cameraAction.textContent = currentStream ? 'Reintentar detector' : 'Intentar de nuevo';
        statusEl.style.display='block';
        statusEl.innerHTML = currentStream
            ? `Cámara activa · ${msg}`
            : `${msg}<br><small>Usa <b>localhost</b> o <b>HTTPS</b>.</small>`;
    }

    addEventListener('resize', () => {
        cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();
        renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
    });
</script>
